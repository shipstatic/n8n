# The platform's npm publish law, on a TAG trigger.
#
# The law (root CLAUDE.md, "The npm publish law") says: the version picks the
# channel, the branch grants the right to use it, publishes are idempotent, and
# a skip says so out loud. This repo publishes to npm — so unlike the vscode
# translation, every MECHANISM applies here verbatim (dist-tags, semver
# prereleases, trusted publishing). Only the trigger differs, and it changes
# exactly one clause:
#
#   the version picks the channel  → unchanged: a `-` suffix → `beta`.
#   the branch grants the right    → the TAG grants it, because a tag is what
#                                    fires this. So the tag and the manifest
#                                    must agree, asserted before anything is
#                                    packaged — the vscode translation's
#                                    assertion, and it exists because tagging
#                                    v1.0.0 on a 0.2.10 tree once published
#                                    0.2.10 under a v1.0.0 Release.
#   credential scoping             → `npm-beta` / `npm-latest` environments
#                                    whose deployment policy admits `v*` TAGS
#                                    rather than `main`. Tag policies were
#                                    proven to work on the vscode repo's
#                                    `marketplace` environment.
#   idempotent publishes           → query the registry first; a published
#                                    version is a no-op, so a re-pushed tag or
#                                    a re-run is safe.
#   a skip says so                 → `::notice`, never silence.
#
# WHAT THIS REPLACED, and why it is urgent rather than tidy: the file on
# `development` fired on `push: branches: [main]` with no test job, no version
# guard and no tag, straight into `pnpm publish`. It was inert only because
# 0.7.0 was already on the registry — the first merge of a bumped version to
# `main` would have published `latest` from a branch push, ungated. The
# tag-triggered variant that lived on the abandoned `release-flow` branch was
# no better on auth: `registry-url` + `NODE_AUTH_TOKEN` + `pnpm publish` is the
# dead-token path wearing `id-token: write` as decoration.
#
# AUTHENTICATION IS OIDC, and each half of that is load-bearing:
#   • No `registry-url` on setup-node. It writes an `_authToken` line into
#     `.npmrc` that DISABLES the OIDC handshake even with `id-token: write`
#     declared (actions/setup-node#1551) — the trap that cost days on
#     `@shipstatic/drop`.
#   • `npm publish`, never `pnpm publish`. pnpm has no OIDC support. This is
#     the one place the platform does not use pnpm.
#   • `npm install -g npm@latest` first: OIDC needs npm >= 11.5.1 and node 22
#     bundles 10.x.
#   • A long-lived token could not publish here even if configured — npm
#     restricts token-based direct publishing for 2FA-protected accounts
#     (gh.io/npm-gat-bypass2fa-deprecation), and the failure presents as a bare
#     403 rather than a policy message.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same gate `ci.yml` runs on every branch, re-run against the tagged
  # tree. A tag can point anywhere, so "development was green" is not a
  # statement about this ref.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm lint:n8n
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm coverage

  # The publish decision is its own job because `publish`'s `environment:` is
  # evaluated before any of its steps run — it can only read another job's
  # outputs, never its own. Same reason the law splits `version` out.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # --- The tag grants the right, so the tag and the manifest must
          # agree. One fact, otherwise stated twice with nothing comparing them.
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error title=Tag and manifest disagree::$GITHUB_REF_NAME was pushed, but package.json holds $VERSION. Tag v$VERSION, or bump the manifest to match the tag."
            exit 1
          fi

          # --- The VERSION picks the channel. Never the branch: a stable
          # 2.0.0 published under `beta` burns the number forever, because npm
          # forbids republishing a version.
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi

          # --- Idempotence: a version already on the registry is a no-op.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice title=Publish skipped::$NAME@$VERSION is already on the registry. Re-running a published tag is a no-op."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Publishing::$NAME $VERSION on the $TAG dist-tag."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: [test, version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Both environments carry a `v*` TAG deployment policy, and it is worth
    # being exact about what that does and does not buy, because it is WEAKER
    # than the branch-triggered repos' equivalent and should not be read as
    # equal.
    #
    # What the policy enforces: no workflow on a BRANCH ref can reach either
    # credential. Only a tag-triggered run can publish at all. (A repo-level
    # secret is reachable by ANY workflow without declaring an environment,
    # which is what makes the scoping load-bearing rather than tidy.)
    #
    # What it does NOT enforce: the channel split. A deployment policy is a
    # glob over the ref NAME — `v*` matches `v1.0.0` and `v1.0.0-beta.1`
    # alike, and GitHub's pattern syntax has no negation, so "stable tags
    # only" is not expressible. What actually routes a prerelease away from
    # `npm-latest` is the version-derived `environment:` expression below plus
    # the tag↔manifest assertion above. On `main`-triggered repos GitHub
    # refuses the job outright; here the derivation is the gate and the policy
    # is the fence around it.
    environment: npm-${{ needs.version.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    # Job level, not step level: a step's `if:` cannot read its own step-level
    # `env:` block. That exact mistake made every vscode release publish
    # nothing, silently, and look green — recorded in root CLAUDE.md.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      # Deliberately NO `registry-url` — see the header.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # OIDC needs npm >= 11.5.1; node 22 bundles 10.x.
      - run: npm install -g npm@latest

      # Idempotence is a STEP skip, not a job skip. A job-level `if:` would
      # also skip the Release below, so a run that published and then failed on
      # a transient Release error could never be re-run into a complete state —
      # the version is on npm forever, and the artifact trail would be lost.
      # Same reason the vscode release skips per registry.
      - if: needs.version.outputs.publish == 'true'
        run: npm publish --access public --provenance --tag "${{ needs.version.outputs.tag }}"

      # The artifact trail, and it runs unconditionally BECAUSE of the above.
      # `generate_release_notes` is why this repo no longer needs release-it:
      # the notes are produced where the tag is already asserted against the
      # manifest, rather than by a local tool that could disagree with it.
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ needs.version.outputs.tag == 'beta' }}
          generate_release_notes: true

      # Guarded, like `ci.yml`'s. Unguarded, an unset webhook fails the job
      # AFTER a successful publish — reporting a completed, irreversible
      # release as red. The inverse of the vscode defect, from the same cause.
      - if: needs.version.outputs.publish == 'true' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ n8n-nodes-shipstatic ${{ needs.version.outputs.version }} published (${{ needs.version.outputs.tag }})"

      - if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🔴 n8n-nodes-shipstatic publish failed"
